[package]
name = "citrus"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
logos = "0.16.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = "1.52.3"
clap = { version = "4", features = ["derive"] }
thiserror = "2.0.18"
inkwell = { version = "0.9.0", features = ["llvm21-1"] }